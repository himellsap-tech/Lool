name: HIMEL Cloud Build

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.10.2'

  - name: Check and extract ZIP
    run: |
      echo "Repository contents:"
      ls -la

      mkdir -p extracted

      if [ ! -f "lulu.zip" ]; then
        echo "ERROR: lulu.zip is missing from repository root"
        exit 1
      fi

      unzip -o -q lulu.zip -d extracted

      echo "Extracted contents:"
      find extracted -maxdepth 4 -type f | head -100

  - name: Locate and compile mod
    run: |
      BUILD_FILE=$(find extracted -type f -name "build.gradle" -print -quit)

      if [ -z "$BUILD_FILE" ]; then
        echo "ERROR: No build.gradle found in lulu.zip"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$BUILD_FILE")

      echo "Gradle project: $PROJECT_DIR"

      cd "$PROJECT_DIR"

      gradle build --no-daemon

  - name: Prepare JAR
    run: |
      mkdir -p output

      find extracted -type f -path "*/build/libs/*.jar" \
        ! -name "*-sources.jar" \
        ! -name "*-javadoc.jar" \
        -exec cp {} output/ \;

      echo "Generated files:"
      ls -lh output/

  - name: Upload mod JAR
    uses: actions/upload-artifact@v4
    with:
      name: HIMEL-AI-Companion-JAR
      path: output/*.jar
      if-no-files-found: error
