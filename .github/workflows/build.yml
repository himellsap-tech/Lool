name: HIMEL Cloud Build

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.10.2'

  - name: Locate and extract ZIP
    run: |
      echo "Repository files:"
      find . -maxdepth 4 -type f

      ZIP=$(find . -type f -iname "*.zip" -not -path "./.git/*" -print -quit)

      if [ -z "$ZIP" ]; then
        echo "ERROR: No ZIP uploaded to repository!"
        exit 1
      fi

      echo "Found ZIP: $ZIP"
      mkdir -p extracted
      unzip -q -o "$ZIP" -d extracted

  - name: Build mod
    run: |
      BUILD_FILE=$(find extracted -type f -name build.gradle -print -quit)

      if [ -z "$BUILD_FILE" ]; then
        echo "ERROR: No build.gradle found in ZIP"
        find extracted -maxdepth 5 -type f
        exit 1
      fi

      PROJECT_DIR=$(dirname "$BUILD_FILE")
      echo "Project: $PROJECT_DIR"
      cd "$PROJECT_DIR"
      gradle build --no-daemon

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: HIMEL-AI-Companion-JAR
      path: extracted/**/build/libs/*.jar
      if-no-files-found: error
